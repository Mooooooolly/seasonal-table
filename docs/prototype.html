].map(a=>{const r={id:a[0],name:a[1],veg:a[2],eq:a[3],serve:a[4],ing:a[5],sea:a[6],url:a[7]};
  const s=r.veg.filter(x=>V[x].season).length;
  r.season=V[r.veg[0]].season || s/r.veg.length>=0.5; return r;});

const EQ=["電鍋","炒鍋","湯鍋","烤箱"];
const st={tab:"ing",season:false,eq:new Set(EQ),q:"",cart:[],done:{}};
try{const s=JSON.parse(localStorage.getItem("seasonal-proto")||"null"); if(s){st.cart=s.cart||[];st.done=s.done||{};if(s.eq)st.eq=new Set(s.eq)}}catch(e){}
function save(){try{localStorage.setItem("seasonal-proto",JSON.stringify({cart:st.cart,done:st.done,eq:[...st.eq]}))}catch(e){}}
const $=s=>document.querySelector(s), main=$("#main"), layer=$("#layer");
const pct=d=>(d<0?"−":"+")+Math.abs(Math.round(d*100))+"%";
const eqOk=r=>r.eq.every(e=>e==="免開火"||st.eq.has(e));
const blk=(n,c)=>`<div class="blk ${c||""}" style="background:${V[n].c}" aria-hidden="true">${n[0]}</div>`;
const deltaTxt=v=>`<span class="${v.delta<0?"cheap":"dear"}">較近 11 個月中位數 ${pct(v.delta)}</span>`;

function renderIng(){
  $("#title").textContent="食材";
  $("#sub").textContent="北部批發市場・蔬菜・依當季與交易量排序";
  const list=[...VEG].sort((a,b)=>(b.season-a.season)||(b.vol-a.vol)).filter(v=>!st.season||v.season);
  main.innerHTML=`<div class="seg"><button class="chip" id="fs" aria-pressed="${st.season}">只看當季</button></div>
  <div class="list">${list.map(v=>{
    const n=R.filter(r=>r.veg.includes(v.n)).length;
    return `<button class="item" data-v="${v.n}">${blk(v.n)}<div class="body">
      <div class="row1"><span class="name">${v.alias}</span>${v.season?'<span class="tag">當季</span>':""}</div>
      <div class="price">${v.lo}–${v.hi} <small>元/台斤</small></div>
      <div class="meta">批發價・${deltaTxt(v)}</div></div>
      <div class="right">${n} 道食譜<br>›</div></button>`}).join("")}</div>
  <p class="note">當季 = 本月以來加權均價低於近 11 個月中位數,且日均交易量高於中位數(原型簡化版,正式版改用近一週)。批發價不等於超市零售價。</p>`;
  $("#fs").onclick=()=>{st.season=!st.season;renderIng()};
  main.querySelectorAll(".item").forEach(b=>b.onclick=()=>openVeg(b.dataset.v));
}
function recCard(r){
  return `<button class="item" data-r="${r.id}">${blk(r.veg[0],"")}<div class="body">
    <div class="row1"><span class="name">${r.name}</span>${r.season?'<span class="tag">當季</span>':""}</div>
    <div class="meta">${r.veg.map(x=>V[x].alias).join("、")}・${r.ing.length} 項食材</div>
    <div class="eq">${(r.eq.length?r.eq:["器材未確認"]).map(e=>`<span>${e}</span>`).join("")}</div></div><div class="right">›</div></button>`;
}
function renderRec(){
  $("#title").textContent="食譜";
  $("#sub").textContent="預設只顯示家裡有的器材做得出的菜";
  const q=st.q.trim();
  const list=R.filter(r=>(!st.season||r.season)&&eqOk(r)&&(!q||r.ing.join(" ").includes(q)||r.name.includes(q)||r.veg.some(x=>V[x].alias.includes(q)||x.includes(q))))
    .sort((a,b)=>b.season-a.season);
  main.innerHTML=`<input type="search" id="q" placeholder="輸入食材或菜名,例如:蛋、地瓜" value="${q}" aria-label="搜尋食材或菜名">
  <div class="seg"><button class="chip" id="fs" aria-pressed="${st.season}">只看當季</button></div>
  <div class="label">我家有的器材</div>
  <div class="seg">${EQ.map(e=>`<button class="chip" data-e="${e}" aria-pressed="${st.eq.has(e)}">${e}</button>`).join("")}</div>
  <div class="label">${list.length} 道</div>
  <div class="list">${list.map(recCard).join("")||'<div class="empty">沒有符合的食譜,試著放寬器材或關掉「只看當季」。</div>'}</div>`;
  const qi=$("#q"); qi.oninput=()=>{st.q=qi.value;const p=qi.selectionStart;renderRec();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
  $("#fs").onclick=()=>{st.season=!st.season;renderRec()};
  main.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const e=b.dataset.e;st.eq.has(e)?st.eq.delete(e):st.eq.add(e);save();renderRec()});
  main.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>openRec(b.dataset.r));
}
function renderCart(){
  $("#title").textContent="採買清單";
  const rs=st.cart.map(id=>R.find(r=>r.id===id));
  $("#sub").textContent=rs.length?`${rs.length} 道菜`:"從食譜加入後,食材會合併顯示在這裡";
  if(!rs.length){main.innerHTML='<div class="empty">還沒有加入任何食譜。<br>到「食譜」分頁挑一道菜,按「加入採買清單」。</div>';return}
  const g={};
  rs.forEach(r=>r.ing.forEach(line=>{
    const tv=r.veg.find(x=>line.includes(V[x].alias)||line.includes(x)||(x==="花胡瓜"&&line.includes("小黃瓜")));
    const sp=line.indexOf(" "), nm=sp>0?line.slice(0,sp):line, qty=sp>0?line.slice(sp+1):"";
    const key=tv||nm; (g[key]=g[key]||{tv,lines:[]}).lines.push({r:r.name,l:tv?line:qty});
  }));
  const keys=Object.keys(g).sort((a,b)=>(!!g[b].tv)-(!!g[a].tv));
  main.innerHTML=`<div class="label">已加入的菜(點一下移除)</div><div class="seg">${rs.map(r=>`<button class="chip" data-x="${r.id}" aria-label="移除 ${r.name}">${r.name} ✕</button>`).join("")}</div><div class="list">${keys.map(k=>{const o=g[k],v=o.tv&&V[o.tv];
    return `<label class="chk ${st.done[k]?"done":""}"><input type="checkbox" data-k="${k}" ${st.done[k]?"checked":""}>
    <div class="body"><div class="name">${v?v.alias:k} ${v&&v.season?'<span class="tag">當季</span>':""}</div>
    ${v?`<div class="price">${v.lo}–${v.hi} <small>元/台斤</small></div>`:""}
    ${o.lines.map(x=>`<div class="src"><span class="rn">${x.r}</span><span class="q">${x.l}</span></div>`).join("")}</div></label>`}).join("")}</div>
  <button class="btn alt" id="clr">清空清單</button>
  <p class="note">第一版只合併蔬菜,份量不自動加總,預估總價留到第二版。</p>`;
  main.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{st.done[c.dataset.k]=c.checked;save();renderCart()});
  main.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{st.cart=st.cart.filter(i=>i!==b.dataset.x);save();render()});
  $("#clr").onclick=()=>{st.cart=[];st.done={};save();render()};
}
function render(){
  document.querySelectorAll("nav [data-tab]").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===st.tab));
  const n=$("#cartn"); n.hidden=!st.cart.length; n.textContent=st.cart.length;
  ({ing:renderIng,rec:renderRec,cart:renderCart})[st.tab]();
}
function closeSheet(){layer.innerHTML=""}
function sheet(html){
  layer.innerHTML=`<div class="scrim" id="sc"></div><div class="sheet" role="dialog" aria-modal="true"><div class="in"><div class="grab"></div>${html}</div></div>`;
  $("#sc").onclick=closeSheet; const c=layer.querySelector(".close"); if(c){c.onclick=closeSheet;c.focus()}
}
function openVeg(n){
  const v=V[n], rs=R.filter(r=>r.veg.includes(n)&&eqOk(r));
  sheet(`<button class="close">關閉</button><div class="row1">${blk(n,"sm")}<div><h2>${v.alias}${v.season?' <span class="tag">當季</span>':""}</h2>
    <div class="price">${v.lo}–${v.hi} <small>元/台斤</small></div></div></div>
    <div class="meta" style="margin-top:8px">批發價・${deltaTxt(v)}・近一個月交易量約 ${v.vol.toLocaleString()} 公噸</div>
    <h3>用它做的菜(${rs.length})</h3><div class="list">${rs.map(recCard).join("")||'<div class="empty">目前器材篩選下沒有食譜。</div>'}</div>`);
  layer.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>openRec(b.dataset.r));
}
function openRec(id){
  const r=R.find(x=>x.id===id), inCart=st.cart.includes(id);
  sheet(`<button class="close">關閉</button><h2>${r.name}${r.season?' <span class="tag">當季</span>':""}</h2>
    <div class="meta">${r.serve}・${(r.eq.length?r.eq:["器材未確認"]).join("、")}</div>
    <h3>食材</h3><ul class="ing">${r.ing.map(l=>{const tv=r.veg.find(x=>l.includes(V[x].alias)||l.includes(x)||(x==="花胡瓜"&&l.includes("小黃瓜")));
      return `<li><span>${l}</span>${tv?`<span class="tr">${V[tv].lo}–${V[tv].hi} 元/斤${V[tv].season?"・當季":""}</span>`:""}</li>`}).join("")}</ul>
    <h3>佐料</h3><ul class="ing"><li><span>${r.sea}</span></li></ul>
    <button class="btn" id="add" ${inCart?"disabled":""}>${inCart?"已在採買清單":"加入採買清單"}</button>
    <a class="btn alt" href="${r.url}" target="_blank" rel="noopener">看原食譜</a>
    <p class="note">份量照來源標示,「推定」是整理時依做法估的。</p>`);
  $("#add").onclick=()=>{st.cart.push(id);save();render();openRec(id)};
}
document.querySelectorAll("nav [data-tab]").forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;closeSheet();render();window.scrollTo(0,0)});
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
render();
</script>
