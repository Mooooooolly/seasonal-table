<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>時令食材</title>
<meta name="description" content="北部批發市場蔬菜行情、盛產標示與食譜採買清單">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#EEF2EC; --card:#FFFFFF; --ink:#16281F; --muted:#5E7066; --line:#D8E0D6;
  --accent:#1F6B4A; --accent-ink:#FFFFFF; --season:#C8431B; --season-bg:#FBE6DD;
  --cheap:#1F6B4A; --dear:#8A5A12; --chip:#E1E9DF; --sheet-shadow:rgba(10,30,20,.28);
  --font:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A14; --card:#18271F; --ink:#E6EFE8; --muted:#97AA9E; --line:#2A3C32;
  --accent:#6FCB9B; --accent-ink:#0F1A14; --season:#FF9A73; --season-bg:#3A221A;
  --cheap:#6FCB9B; --dear:#E2B461; --chip:#223329; --sheet-shadow:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A14; --card:#18271F; --ink:#E6EFE8; --muted:#97AA9E; --line:#2A3C32;
  --accent:#6FCB9B; --accent-ink:#0F1A14; --season:#FF9A73; --season-bg:#3A221A;
  --cheap:#6FCB9B; --dear:#E2B461; --chip:#223329; --sheet-shadow:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto}
header{padding-top:18px}
.info{font-size:12px;color:var(--muted);background:var(--chip);border-radius:6px;padding:6px 10px;margin-bottom:14px}
h1{font-size:26px;font-weight:900;margin:0;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin:2px 0 14px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:14px 0 8px}
input[type=search]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.blk{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:24px;color:#10241A}
.blk.sm{width:40px;height:40px;font-size:18px;border-radius:10px}
.body{min-width:0;flex:1}
.row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.name{font-weight:700;font-size:16px}
.tag{font-size:11px;font-weight:700;color:var(--season);background:var(--season-bg);padding:1px 7px;border-radius:999px;white-space:nowrap}
.price{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.price small{font-family:var(--font);color:var(--muted);font-size:11px}
.meta{font-size:12px;color:var(--muted)}
.cheap{color:var(--cheap)} .dear{color:var(--dear)}
.right{flex:none;text-align:right;font-size:12px;color:var(--muted)}
.eq{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.eq span{font-size:11px;background:var(--chip);border-radius:5px;padding:0 6px;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));z-index:5}
nav button{flex:1;background:none;border:0;font:inherit;font-size:13px;color:var(--muted);padding:8px 0;cursor:pointer;border-radius:8px;position:relative;min-height:44px}
nav button[aria-current="true"]{color:var(--accent);font-weight:700}
nav .n{position:absolute;top:2px;margin-left:4px;background:var(--season);color:var(--accent-ink);font-size:10px;border-radius:999px;padding:0 6px;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:18px 18px 0 0;z-index:9;
  box-shadow:0 -8px 30px var(--sheet-shadow);padding:16px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 12px}
.close{float:right;background:var(--chip);color:var(--ink);border:0;border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer;min-height:32px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px;font-weight:500}
ul.ing{list-style:none;padding:0;margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px}
ul.ing li{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
ul.ing li:last-child{border:0}
ul.ing .tr{color:var(--accent);font-weight:700;font-size:12px;white-space:nowrap;text-align:right}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-ink);margin-top:14px;text-decoration:none}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:8px}
.btn[disabled]{opacity:.55;cursor:default}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.empty{color:var(--muted);text-align:center;padding:28px 0;font-size:14px}
.chk{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.chk.done .name{text-decoration:line-through;color:var(--muted)}
.src{display:flex;gap:8px;align-items:baseline;font-size:13px;margin-top:3px}
.rn{flex:none;font-size:11px;font-weight:700;color:var(--accent);background:var(--chip);border-radius:5px;padding:0 6px}
.src .q{color:var(--ink);overflow-wrap:anywhere}
.err{background:var(--season-bg);color:var(--season);border-radius:10px;padding:12px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="info" id="info">載入中…</div>
  <h1 id="title">食材</h1>
  <div class="sub" id="sub"></div>
</header>
<main id="main"></main>
</div>
<nav aria-label="主選單">
  <button data-tab="ing" aria-current="true">食材</button>
  <button data-tab="rec" aria-current="false">食譜</button>
  <button data-tab="cart" aria-current="false">採買清單<span class="n" id="cartn" hidden></span></button>
</nav>
<div id="layer"></div>

<script>
const TAG = "盛產";
const EQ = ["電鍋", "炒鍋", "湯鍋", "烤箱"];
const STORE = "seasonal-table-v1";
// 主要食材的色塊顏色;其他群組依名稱自動產生
const COLORS = {高麗菜:"#9CC27A",白蘿蔔:"#DCE6D2",大白菜:"#C9DDA8",玉米:"#F2CB4C",南瓜:"#EA9A44",小黃瓜:"#58A054",小白菜:"#6FA85A",
  絲瓜:"#B3CE78",紅蘿蔔:"#E8743A",油麥菜:"#7DB06B",青花菜:"#5FA36B",地瓜:"#C9708A",洋蔥:"#D9A5C0",番茄:"#E25B45",苦瓜:"#8DBF6A",
  馬鈴薯:"#D8C08A",彩椒:"#E46B4F",鴻喜菇:"#D9CBB4",蒜頭:"#EDE4D3",薑:"#E3C77E",蔥:"#8CC37C",辣椒:"#D9483B",香菜:"#7BB86F",巴西利:"#6FAE5E"};
const color = (n) => COLORS[n] || `hsl(${[...n].reduce((h, c) => (h * 31 + c.codePointAt(0)) % 360, 7)} 45% 72%)`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let G = {}, GROUPS = [], R = [], META = {};
const st = {tab:"ing", season:false, eq:new Set(EQ), q:"", cart:[], done:{}};
try { const s = JSON.parse(localStorage.getItem(STORE) || "null");
  if (s) { st.cart = s.cart || []; st.done = s.done || {}; if (s.eq) st.eq = new Set(s.eq); } } catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify({cart:st.cart, done:st.done, eq:[...st.eq]})); } catch (e) {} }

const $ = (s) => document.querySelector(s), main = $("#main"), layer = $("#layer");
const pct = (d) => (d < 0 ? "−" : d > 0 ? "+" : "±") + Math.abs(d) + "%";
const eqOk = (r) => r.equipment.every((e) => e === "免開火" || st.eq.has(e));
const blk = (n, c) => `<div class="blk ${c || ""}" style="background:${color(n)}" aria-hidden="true">${esc([...n][0])}</div>`;
const tag = (on) => (on ? `<span class="tag">${TAG}</span>` : "");
const priceTxt = (g) => (g && g.price_lo != null ? `${g.price_lo === g.price_hi ? g.price_lo : `${g.price_lo}–${g.price_hi}`} <small>元/台斤</small>` : `<small>近期無成交</small>`);
const deltaTxt = (g) => (g.delta_pct == null ? "" : `・<span class="${g.delta_pct < 0 ? "cheap" : g.delta_pct > 0 ? "dear" : ""}">較近一年中位數 ${pct(g.delta_pct)}</span>`);
const recipesOf = (name) => R.filter((r) => r.main_group === name || r.ingredients.some((i) => i.group === name));
// 食材分頁:前 10% 的群組,加上當作某道食譜主食材的群組
const showGroup = (g) => g.role === "主食材" && (g.is_top10 || R.some((r) => r.main_group === g.name));

function renderIng() {
  $("#title").textContent = "食材";
  $("#sub").textContent = "北部批發市場・蔬菜・依盛產與交易量排序";
  const list = GROUPS.filter(showGroup)
    .sort((a, b) => (!!b.is_season - !!a.is_season) || (b.vol_30d_ton - a.vol_30d_ton))
    .filter((g) => !st.season || g.is_season);
  main.innerHTML = `<div class="seg"><button class="chip" id="fs" aria-pressed="${st.season}">只看${TAG}</button></div>
  <div class="list">${list.map((g) => {
    const n = recipesOf(g.name).length;
    return `<button class="item" data-g="${esc(g.name)}">${blk(g.name)}<div class="body">
      <div class="row1"><span class="name">${esc(g.name)}</span>${tag(g.is_season)}</div>
      <div class="price">${priceTxt(g)}</div>
      <div class="meta">批發價${deltaTxt(g)}</div></div>
      <div class="right">${n ? `${n} 道食譜` : "還沒有食譜"}<br>›</div></button>`;
  }).join("") || `<div class="empty">目前沒有${TAG}的食材。</div>`}</div>
  <p class="note">${TAG} = 最近 7 個交易日的批發均價低於近一年中位數,且交易量高於近一年中位數。只代表批發市場的狀況,不等於超市零售價。</p>`;
  $("#fs").onclick = () => { st.season = !st.season; renderIng(); };
  main.querySelectorAll("[data-g]").forEach((b) => (b.onclick = () => openGroup(b.dataset.g)));
}

function recCard(r) {
  const groups = [...new Set([r.main_group, ...r.ingredients.map((i) => i.group)].filter((x) => x && G[x]?.role === "主食材"))];
  return `<button class="item" data-r="${esc(r.id)}">${blk(r.main_group || r.name)}<div class="body">
    <div class="row1"><span class="name">${esc(r.name)}</span>${tag(r.is_season)}</div>
    <div class="meta">${esc(groups.join("、"))}・${r.ingredients.length} 項食材</div>
    <div class="eq">${(r.equipment.length ? r.equipment : ["器材未確認"]).map((e) => `<span>${esc(e)}</span>`).join("")}</div></div><div class="right">›</div></button>`;
}

function renderRec() {
  $("#title").textContent = "食譜";
  $("#sub").textContent = "預設只顯示家裡有的器材做得出的菜";
  const q = st.q.trim();
  const hit = (r) => !q || r.name.includes(q) || r.ingredients.some((i) => i.name.includes(q) || (i.group || "").includes(q));
  const list = R.filter((r) => (!st.season || r.is_season) && eqOk(r) && hit(r)).sort((a, b) => !!b.is_season - !!a.is_season);
  main.innerHTML = `<input type="search" id="q" placeholder="輸入食材或菜名,例如:蛋、地瓜" value="${esc(q)}" aria-label="搜尋食材或菜名">
  <div class="seg"><button class="chip" id="fs" aria-pressed="${st.season}">只看${TAG}</button></div>
  <div class="label">我家有的器材</div>
  <div class="seg">${EQ.map((e) => `<button class="chip" data-e="${e}" aria-pressed="${st.eq.has(e)}">${e}</button>`).join("")}</div>
  <div class="label">${list.length} 道</div>
  <div class="list">${list.map(recCard).join("") || `<div class="empty">沒有符合的食譜,試著放寬器材或關掉「只看${TAG}」。</div>`}</div>`;
  const qi = $("#q");
  qi.oninput = () => { st.q = qi.value; const p = qi.selectionStart; renderRec(); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); };
  $("#fs").onclick = () => { st.season = !st.season; renderRec(); };
  main.querySelectorAll("[data-e]").forEach((b) => (b.onclick = () => { const e = b.dataset.e; st.eq.has(e) ? st.eq.delete(e) : st.eq.add(e); save(); renderRec(); }));
  main.querySelectorAll("[data-r]").forEach((b) => (b.onclick = () => openRec(b.dataset.r)));
}

function renderCart() {
  $("#title").textContent = "採買清單";
  const rs = st.cart.map((id) => R.find((r) => r.id === id)).filter(Boolean);
  $("#sub").textContent = rs.length ? `${rs.length} 道菜` : "從食譜加入後,食材會合併顯示在這裡";
  if (!rs.length) { main.innerHTML = `<div class="empty">還沒有加入任何食譜。<br>到「食譜」分頁挑一道菜,按「加入採買清單」。</div>`; return; }
  // 同一群組(或同名食材)合併成一張卡片;標題只放食材名稱,份量寫在卡片內每一行
  const cards = new Map();
  const NOT_SHOPPING = /^(水|開水|熱開水|清水)$/; // 不用買的
  rs.forEach((r) => r.ingredients.forEach((i) => {
    if (NOT_SHOPPING.test(i.name)) return;
    const key = i.group || i.name;
    if (!cards.has(key)) cards.set(key, {key, group:i.group ? G[i.group] : null, lines:[]});
    cards.get(key).lines.push({r:r.name, l:i.group && i.name !== i.group ? `${i.name} ${i.qty_text || ""}` : i.qty_text || "未標示份量"});
  }));
  const rank = (c) => (c.group?.role === "主食材" ? 0 : c.group ? 1 : 2);
  const list = [...cards.values()].sort((a, b) => rank(a) - rank(b));
  main.innerHTML = `<div class="label">已加入的菜(點一下移除)</div>
  <div class="seg">${rs.map((r) => `<button class="chip" data-x="${esc(r.id)}" aria-label="移除 ${esc(r.name)}">${esc(r.name)} ✕</button>`).join("")}</div>
  <div class="list">${list.map((c) => `<label class="chk ${st.done[c.key] ? "done" : ""}"><input type="checkbox" data-k="${esc(c.key)}" ${st.done[c.key] ? "checked" : ""}>
    <div class="body"><div class="row1"><span class="name">${esc(c.key)}</span>${tag(c.group?.is_season)}</div>
    ${c.group ? `<div class="price">${priceTxt(c.group)}</div>` : ""}
    ${c.lines.map((x) => `<div class="src"><span class="rn">${esc(x.r)}</span><span class="q">${esc(x.l)}</span></div>`).join("")}</div></label>`).join("")}</div>
  <button class="btn alt" id="clr">清空清單</button>
  <p class="note">同一種食材會合併成一張卡片。份量不自動加總,也不估總價。價格是批發價。</p>`;
  main.querySelectorAll("[data-k]").forEach((c) => (c.onchange = () => { st.done[c.dataset.k] = c.checked; save(); renderCart(); }));
  main.querySelectorAll("[data-x]").forEach((b) => (b.onclick = () => { st.cart = st.cart.filter((i) => i !== b.dataset.x); save(); render(); }));
  $("#clr").onclick = () => { if (confirm("確定清空採買清單?")) { st.cart = []; st.done = {}; save(); render(); } };
}

function render() {
  document.querySelectorAll("nav [data-tab]").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === st.tab));
  const n = $("#cartn"); n.hidden = !st.cart.length; n.textContent = st.cart.length;
  ({ing:renderIng, rec:renderRec, cart:renderCart})[st.tab]();
}

let lastFocus = null;
function closeSheet() { layer.innerHTML = ""; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
function sheet(html, label) {
  if (!layer.innerHTML) lastFocus = document.activeElement;
  layer.innerHTML = `<div class="scrim" id="sc"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="in"><div class="grab"></div>${html}</div></div>`;
  $("#sc").onclick = closeSheet;
  const c = layer.querySelector(".close"); if (c) { c.onclick = closeSheet; c.focus(); }
}

function openGroup(name) {
  const g = G[name], rs = recipesOf(name).filter(eqOk);
  sheet(`<button class="close">關閉</button><div class="row1">${blk(name, "sm")}<div><h2>${esc(name)} ${tag(g.is_season)}</h2>
    <div class="price">${priceTxt(g)}</div></div></div>
    <div class="meta" style="margin-top:8px">批發價${deltaTxt(g)}・近 30 天交易量約 ${Math.round(g.vol_30d_ton).toLocaleString()} 公噸${g.rank ? `・第 ${g.rank} 名` : ""}</div>
    <h3>用它做的菜(${rs.length})</h3><div class="list">${rs.map(recCard).join("") ||
      `<div class="empty">${recipesOf(name).length ? "目前器材篩選下沒有食譜。" : "還沒有食譜。"}</div>`}</div>`, name);
  layer.querySelectorAll("[data-r]").forEach((b) => (b.onclick = () => openRec(b.dataset.r)));
}

function openRec(id) {
  const r = R.find((x) => x.id === id), inCart = st.cart.includes(id);
  sheet(`<button class="close">關閉</button><h2>${esc(r.name)} ${tag(r.is_season)}</h2>
    <div class="meta">${esc(r.servings_text || "份數未標示")}・${esc((r.equipment.length ? r.equipment : ["器材未確認"]).join("、"))}</div>
    <h3>食材</h3><ul class="ing">${r.ingredients.map((i) => {
      const g = i.group && G[i.group];
      return `<li><span>${esc(i.name)} ${esc(i.qty_text || "")}</span>${g && g.price_lo != null
        ? `<span class="tr">${g.price_lo}–${g.price_hi} 元/斤${g.is_season ? `・${TAG}` : ""}</span>` : ""}</li>`;
    }).join("")}</ul>
    <h3>佐料</h3><ul class="ing"><li><span>${esc(r.seasonings_text || "未標示")}</span></li></ul>
    <button class="btn" id="add" ${inCart ? "disabled" : ""}>${inCart ? "已在採買清單" : "加入採買清單"}</button>
    ${r.source_url ? `<a class="btn alt" href="${esc(r.source_url)}" target="_blank" rel="noopener noreferrer">看原食譜</a>` : ""}
    <p class="note">份量照來源標示,「推定」是整理時依做法估的。價格是批發價。</p>`, r.name);
  $("#add").onclick = () => { st.cart.push(id); save(); render(); openRec(id); };
}

document.querySelectorAll("nav [data-tab]").forEach((b) => (b.onclick = () => { st.tab = b.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); }));
addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

(async function load() {
  try {
    const [g, r] = await Promise.all(["data/groups.json", "data/recipes.json"].map((u) =>
      fetch(u, {cache:"no-cache"}).then((x) => { if (!x.ok) throw new Error(u + " " + x.status); return x.json(); })));
    META = g; GROUPS = g.groups; GROUPS.forEach((x) => (G[x.name] = x));
    R = r.recipes;
    st.cart = st.cart.filter((id) => R.some((x) => x.id === id));
    const fmt = (d) => d ? d.slice(5).replace("-", "/") : "?";
    $("#info").textContent = `批發價(北部五市場),資料期間 ${fmt(g.window_start)}–${fmt(g.data_date)}。不是超市零售價。`;
    const age = g.data_date ? Math.floor((Date.now() - new Date(g.data_date + "T00:00:00+08:00")) / 86400000) : 99;
    if (age > 7) {
      $("#info").classList.add("err");
      $("#info").textContent = `資料已經 ${age} 天沒有更新(最新是 ${fmt(g.data_date)}),價格與${TAG}標示可能不準。`;
    }
    render();
  } catch (e) {
    $("#info").textContent = "";
    main.innerHTML = `<div class="err">資料載入失敗,請稍後重新整理。(${esc(e.message)})</div>`;
  }
})();
</script>
</body>
</html>
