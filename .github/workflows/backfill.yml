name: 補歷史資料(手動)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "往回補幾天"
        default: "400"

permissions:
  contents: write

concurrency:
  group: db-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://uahnndhsrztgdiwtkkyx.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DAYS: ${{ inputs.days }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 補抓並寫入 Supabase
        run: node scripts/backfill.mjs

      - name: 把結果 commit 回 repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/ || true
          git commit -m "補歷史資料結果 $(date -u +%Y-%m-%dT%H:%MZ)" || echo "沒有變更"
          git pull --rebase -q && git push
