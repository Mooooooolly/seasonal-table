name: 重算當季與價格(手動)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: db-write
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://uahnndhsrztgdiwtkkyx.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGOPTIONS: "-c client_min_messages=warning"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 更新資料表結構
        run: bash scripts/migrate.sh

      - name: 重算並產出前台 JSON
        run: bash scripts/recompute.sh

      - name: 寫檢查報告
        run: node scripts/compute-report.mjs

      - name: 把結果 commit 回 repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/ public/data/ || true
          git commit -m "重算結果 $(date -u +%Y-%m-%dT%H:%MZ)" || echo "沒有變更"
          git pull --rebase -q && git push
